# Runs the unit tests (including the Robolectric UI tests) and an unsigned release build on
# every push and pull request. Nothing is signed or published here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # gradle.properties points org.gradle.java.home at a local Android Studio; CI uses setup-java
      - name: Use the CI JDK
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Release build (unsigned)
        run: ./gradlew --no-daemon assembleRelease

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build_clean/reports/tests/
