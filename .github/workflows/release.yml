# Publishes a signed APK when a version tag (for example v1.1.3) is pushed:
#   tests -> signed release build -> identity checks -> GitHub Release with baziq-calculator.apk
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   BAZIQ_KEYSTORE_BASE64   the release keystore (baziq-release.p12), base64-encoded
#   BAZIQ_KEYSTORE_PASSWORD its password
#   BAZIQ_KEY_ALIAS         baziq-calculator
#   BAZIQ_KEY_PASSWORD      the key password (same as the keystore password for a .p12)
# The keystore never enters the repository; it is written to the runner's temp folder and deleted.
#
# Without these secrets the run stops with a warning and publishes nothing (releases are then
# built and published from the computer that holds the key, as for 1.1.3). A release that
# already exists for the tag is never replaced.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP_ID: com.omnicalc.platform
  # SHA-256 of the release signing certificate. Every official APK must carry it.
  EXPECTED_CERT_SHA256: 22c1d206219ab2ec162e069122513be35ec0618ee3decd63f3412683dc8bea75
  APK_NAME: baziq-calculator.apk

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the CI JDK
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Check the signing secrets and the release
        id: check
        env:
          KS: ${{ secrets.BAZIQ_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BAZIQ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAZIQ_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BAZIQ_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing BAZIQ_KEYSTORE_BASE64"
          [ -n "$KS_PASS" ] || missing="$missing BAZIQ_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing BAZIQ_KEY_ALIAS"
          [ -n "$KEY_PASS" ] || missing="$missing BAZIQ_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::Signing secrets not configured:$missing. Nothing was built or published."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::warning::Release $GITHUB_REF_NAME already exists; it is left unchanged."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        if: steps.check.outputs.ready == 'true'
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Signed release build
        if: steps.check.outputs.ready == 'true'
        env:
          KS: ${{ secrets.BAZIQ_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.BAZIQ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BAZIQ_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BAZIQ_KEY_PASSWORD }}
        run: |
          SIGN_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGN_DIR"
          echo "$KS" | base64 --decode > "$SIGN_DIR/baziq-release.p12"
          {
            echo "storeFile=baziq-release.p12"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > "$SIGN_DIR/signing.properties"
          BAZIQ_SIGNING_PROPERTIES="$SIGN_DIR/signing.properties" ./gradlew --no-daemon assembleRelease
          rm -rf "$SIGN_DIR"

      - name: Check the APK identity
        if: steps.check.outputs.ready == 'true'
        run: |
          APK=app/build_clean/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" certs.txt \
            || { echo "::error::APK is not signed with the release certificate"; exit 1; }
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -q "package: name='$APP_ID'" badging.txt || { echo "::error::Unexpected application ID"; exit 1; }
          if grep -q "application-debuggable" badging.txt; then echo "::error::APK is debuggable"; exit 1; fi
          VERSION=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"; exit 1; }
          cp "$APK" "$APK_NAME"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          cat "$APK_NAME.sha256"

      - name: Publish the GitHub Release
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$NOTES" ] || { echo "::error::Release notes $NOTES are missing"; exit 1; }
          { cat "$NOTES"; echo; echo "**SHA-256** \`$(cut -d' ' -f1 "$APK_NAME.sha256")\` ($APK_NAME)"; \
            echo; echo "Signing certificate SHA-256: \`$EXPECTED_CERT_SHA256\`"; } > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" "$APK_NAME.sha256" \
            --title "Baziq Calculator ${GITHUB_REF_NAME#v}" --notes-file notes.md --latest
